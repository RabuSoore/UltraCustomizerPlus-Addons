name: Build Addon

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      addon:
        description: 'Nama folder addon (misal: Vault, Citizens, Spigot). Kosongkan untuk build SEMUA.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle CLI
      uses: gradle/actions/setup-gradle@v3

    - name: Build Addon
      run: |
        if [ -z "${{ inputs.addon }}" ]; then
          echo "Building ALL addons..."
          gradle build --no-daemon
        else
          echo "Building ONLY addon: ${{ inputs.addon }}"
          gradle :${{ inputs.addon }}:build --no-daemon
        fi

    - name: Upload Compiled JAR
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Addons-${{ inputs.addon || 'ALL' }}
        path: "**/build/libs/*.jar"
        
