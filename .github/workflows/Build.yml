name: Build Addons

on:
  push:
    branches: ["master", "main"]

  pull_request:
    branches: ["master", "main"]

  workflow_dispatch:
    inputs:
      addon:
        description: "Nama folder addon (Citizens, Command, Players, Spigot, Vault). Kosongkan untuk build SEMUA."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Project
        run: |
          if [ -z "${{ inputs.addon }}" ]; then
            echo "Nge-build SEMUA addon..."
            gradle build --no-daemon
          else
            echo "Nge-build addon SPESIFIK: ${{ inputs.addon }}"
            gradle ":${{ inputs.addon }}:build" --no-daemon
          fi

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Addons
          path: "**/build/libs/*.jar"
